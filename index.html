<style>

html,body{margin:0}

header .sub{font-size:14px;opacity:.95}
header.small{padding:6px 16px 12px}header.small .sub{display:none}header.small h1{font-size:17px}

main{padding:14px 14px 20px;max-width:720px;margin:0 auto}

button,input,select,textarea{font:inherit;color:inherit}
button{min-height:44px;border:0;border-radius:10px;background:var(--ocean);color:#fff;padding:0 14px;cursor:pointer}

.tl{position:relative;padding-left:22px}
.tl:before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:3px;background:var(--line);border-radius:2px}
.ev{position:relative;margin-bottom:10px}
.ev:before{content:"";position:absolute;left:-22px;top:18px;width:15px;height:15px;border-radius:50%;background:var(--dc,var(--ocean));border:3px solid var(--bg)}
.ev.now:before{width:21px;height:21px;left:-25px;top:15px;box-shadow:0 0 0 4px rgba(255,107,87,.35);background:var(--coral)}
.ev.past{opacity:.55}

.evh .t{width:58px;flex:none;font-weight:700;color:var(--dc)}

.evh .ic{font-size:22px}
.evh .ti{flex:1;font-weight:600}
.evb{display:none;border-top:1px dashed var(--line);margin-top:6px;padding-top:8px;font-size:15px}
.ev.open .evb{display:block}

a.btn{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border-radius:10px;background:var(--ocean);color:#fff;text-decoration:none;margin:4px 6px 4px 0}
.next{background:linear-gradient(135deg,var(--coral),var(--hibi));color:#fff}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--lagoon)}
.ck{display:flex;gap:10px;align-items:flex-start;min-height:44px;padding:6px 0;border-bottom:1px solid var(--line)}
.ck input[type=checkbox]{width:26px;height:26px;min-height:0;flex:none;margin-top:6px;accent-color:var(--lagoon)}
.ck.done .tx{text-decoration:line-through;color:var(--sub)}
.ck .tx{flex:1}
.ck .tx input{margin-top:4px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 8px rgba(0,0,0,.1)}

nav button.on{color:var(--ocean);font-weight:700}

.sos a.alt{background:var(--ocean)}

.ph .jp{font-size:18px;font-weight:700}

svg.map{width:100%;height:auto;background:var(--sea);border-radius:14px;display:block;touch-action:manipulation}
.pin{cursor:pointer}
.sum{font-size:18px;font-weight:700}

.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#12324A;color:#fff;padding:10px 16px;border-radius:20px;z-index:60;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.on{opacity:1}
textarea{min-height:120px}

function autoDay(){
  if(S.day)return S.day;
  const now=Date.now();
  for(let i=1;i<=4;i++){if(dateOf(i,'23:59').getTime()>=now)return Math.max(1,i)}
  return 1;
}
function nextEvent(){
  const now=Date.now();
  let best=null;
  TRIP.events.forEach((e,i)=>{if(!e.time)return;const ts=dateOf(e.d,e.time).getTime();if(ts>now&&(!best||ts<best.ts))best={e,ts,i}});
  return best;
}
function fmtDur(ms){const m=Math.round(ms/6e4),d=Math.floor(m/1440),h=Math.floor(m%1440/60),mm=m%60;return (d?d+'일 ':'')+(h?h+'시간 ':'')+mm+'분'}
function viewSchedule(){
  const day=autoDay(),D=TRIP.days[day-1],c=DC[day];
  const chips=TRIP.days.map(d=>`<button class="chip ${d.n===day?'on':''}" style="${d.n===day?'background:'+DC[d.n]:''}" data-act="day" data-i="${d.n}">${d.n}일차<br><small>${d.date}(${d.dow})</small></button>`).join('');
  const nx=nextEvent();
  let nextCard='';
  if(nx)nextCard=`<div class="card next"><div class="muted" style="color:#fff">다음 일정까지</div><div class="sum">${fmtDur(nx.ts-Date.now())}</div><div>${nx.e.ic} ${TRIP.days[nx.e.d-1].date}일 ${nx.e.time} ${esc(nx.e.t)}</div></div>`;
  const evs=TRIP.events.map((e,i)=>({e,i})).filter(o=>o.e.d===day);
  const now=Date.now();
  let curIdx=-1;
  evs.forEach(o=>{if(o.e.time&&dateOf(o.e.d,o.e.time).getTime()<=now)curIdx=o.i});
  const list=evs.map(o=>{
    const e=o.e,id='e'+o.i,open=S.open[id];
    const past=e.time&&dateOf(e.d,e.time).getTime()<now&&o.i!==curIdx;
    const nowc=o.i===curIdx&&dateOf(day,'23:59').getTime()>=now;
    const nxt=evs.find(x=>x.i>o.i&&x.e.time);
    let gap='';
    if(e.time&&nxt){const g=(dateOf(nxt.e.d,nxt.e.time)-dateOf(e.d,e.time))/6e4;if(g>0)gap=`<span class="tag">다음 일정까지 ${g}분</span>`}
    return `<div class="ev ${open?'open':''} ${past?'past':''} ${nowc?'now':''}" style="--dc:${c}">
      <div class="card" style="margin:0"><div class="evh" data-act="open" data-id="${id}">
        <div class="t ${e.time?'':'tbd'}">${e.time||'미정'}</div><div class="ic">${e.ic}</div><div class="ti">${esc(e.t)}</div><div>${open?'▴':'▾'}</div></div>
        <div class="evb">${e.note?`<div>📝 ${esc(e.note)}</div>`:''}${e.rain?`<div>☔ ${esc(e.rain)}</div>`:''}${gap}
        <div><a class="btn" target="_blank" rel="noopener" href="${mapsSearch(e.q)}">📍 지도 열기</a></div></div></div></div>`;
  }).join('');
  return `<div class="chips">${chips}</div>${nextCard}
    <div class="card"><h3 style="color:${c}">${D.n}일차 · ${esc(D.title)}</h3><div class="muted">🌅 일몰 ${D.sunset} (대략) · ${esc(D.star)}</div></div>
    <div class="tl">${list}</div>`;
}

    const d=dec(m[1]);
    if(confirm('공유받은 데이터로 덮어쓸까요? (현재 체크/쇼핑/정산 상태가 바뀝니다)')){
      S.names=d.n||S.names;S.chk=d.c||{};S.pack=d.p||{};S.shop=d.s||[];S.pay=d.y||[];S.rate=d.r||'';
      if(d.u)S.num=d.u;if(d.t)S.contacts=d.t;if(typeof d.k==='string')S.park=d.k;
      save();toast('불러왔어요');
    }
  }catch(e){toast('공유 링크를 읽을 수 없어요')}
  history.replaceState(null,'',location.pathname+location.search);
}

/* ============================ 이벤트 ============================ */
document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,id=el.dataset.id,i=+el.dataset.i;
  switch(a){
    case 'tab':S.tab=i;save();render();scrollTo(0,0);break;
    case 'day':S.day=i;save();render();break;
    case 'open':S.open[id]=!S.open[id];save();render(true);break;
    case 'mday':S.mapDay=i;save();render(true);break;
    case 'sub':S.sub=i;save();render();break;
    case 'pin':{
      const k=el.dataset.k,d=+el.dataset.d;
      const es=TRIP.events.map((e,x)=>({e,x})).filter(o=>o.e.d===d&&o.e.loc===k);
      $('#sheet').innerHTML=`<b>📍 ${esc(TRIP.loc[k].n)}</b> <span class="tag">${d}일차</span>`+es.map(o=>`<div>${o.e.ic} ${o.e.time||'미정'} ${esc(o.e.t)}</div>`).join('')+
        `<a class="btn" target="_blank" rel="noopener" href="${mapsSearch(es[0].e.q)}">지도 열기</a><button data-act="jump" data-d="${d}" data-x="${es[0].x}">일정에서 보기</button>`;
      break}
    case 'jump':S.tab=0;S.day=+el.dataset.d;S.open['e'+el.dataset.x]=true;save();render();setTimeout(()=>{const n=document.querySelector('.ev.open');if(n)n.scrollIntoView({block:'center'})},50);break;
    case 'sadd':{const t=$('#sn').value.trim();if(!t)return;S.shop.push({id:uid(),t,place:$('#sp').value,who:+$('#sw').value,done:false});save();render(true);break}
    case 'sdel':S.shop=S.shop.filter(x=>x.id!==id);save();render(true);break;
    case 'padd':{const item=$('#pi').value.trim(),yen=parseInt($('#py').value,10);if(!item||!yen)return toast('항목과 금액을 입력하세요');S.pay.push({id:uid(),item,yen,payer:+$('#pp').value});save();render(true);break}
    case 'pdel':S.pay=S.pay.filter(x=>x.id!==id);save();render(true);break;
    case 'ph':{const p=TRIP.phrases[i];$('#bjp').textContent=p[0];$('#brd').textContent=p[1];$('#bko').textContent=p[2];$('#big').classList.add('on');break}
    case 'parkloc':
      if(!navigator.geolocation)return toast('위치 사용 불가');
      navigator.geolocation.getCurrentPosition(p=>{const l=`https://maps.google.com/?q=${p.coords.latitude},${p.coords.longitude}`;S.park=(S.park?S.park+'\n':'')+new Date().toLocaleString('ko-KR')+' '+l;save();render(true)},()=>toast('위치 권한이 필요해요'));break;
    case 'mklink':{
      const inc=$('#incnum').checked;
      const url=location.href.split('#')[0]+'#d='+enc(payload(inc));
      copy(url,'링크 복사됨');
      $('#shareinfo').textContent=`링크 길이 ${url.length}자`+(url.length>1800?' ⚠️ 너무 길어요 — 카톡에서 잘릴 수 있어요':'');break}
    case 'mktext':copy(exportText(),'텍스트 복사됨');break;
    case 'reset':if(confirm('이 기기의 모든 입력 데이터를 지울까요?')){S=dflt();save();render()}break;
  }
});
document.addEventListener('change',ev=>{
  const el=ev.target,a=el.dataset.act;
  if(a==='chk'){S.chk[el.dataset.id]=el.checked;save();render(true)}
  else if(a==='pack'){S.pack[el.dataset.id]=el.checked;save();render(true)}
  else if(a==='sdone'){const x=S.shop.find(x=>x.id===el.dataset.id);if(x)x.done=el.checked;save();render(true)}
  else if(el.id==='n0'||el.id==='n1'){S.names=[$('#n0').value.trim()||'황갱',$('#n1').value.trim()||'jellyho'];save();header()}
});
document.addEventListener('input',ev=>{
  const el=ev.target,a=el.dataset.act;
  if(a==='num'){S.num[el.dataset.id]=el.value;save()}
  else if(a==='contact'){S.contacts[el.dataset.id]=el.value;save()}
  else if(el.id==='park'){S.park=el.value;save()}
  else if(el.id==='rate'){S.rate=el.value;save()}
});
document.addEventListener('focusout',ev=>{if(ev.target.id==='rate'||ev.target.dataset.act==='contact')render(true)});
$('#big').addEventListener('click',()=>$('#big').classList.remove('on'));
// 좌우 스와이프로 날짜 이동 (일정 탭)
let sx=null;
document.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',e=>{
  if(sx===null||S.tab!==0)return;const dx=e.changedTouches[0].clientX-sx;sx=null;
  if(Math.abs(dx)<90)return;const n=Math.min(4,Math.max(1,autoDay()+(dx<0?1:-1)));if(n!==autoDay()){S.day=n;save();render()}
});

checkHash();render();
setInterval(()=>{if(S.tab===0&&!document.activeElement.matches('input,textarea'))render(true);else header()},60000);
</script>
</body>
</html>
